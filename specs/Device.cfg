\* Two tabs, with two reconnects or reloads: no lost update, and each tab
\* shows the stored build in the end.
CONSTANTS
  Tabs = {t1, t2}
  MaxEdits = 3
  MaxRestarts = 2
  MaxFails = 0
  MaxClears = 0
  ByStamp = TRUE
  ByEpoch = TRUE
  ByReads = TRUE
  ByCheck = TRUE
SPECIFICATION Spec
\* The end of the edits is not a fault.
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoLostUpdate
PROPERTIES Converge
