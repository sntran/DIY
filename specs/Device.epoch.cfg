\* The fault: a tab takes each conflict. Two saves of a tab get conflicts.
\* The tab takes the first one, edits, and saves. Then the second conflict
\* shows an old build again, and no event comes after it.
\* TLC must find: Temporal properties were violated.
CONSTANTS
  Tabs = {t1, t2}
  MaxEdits = 4
  MaxRestarts = 0
  MaxFails = 0
  MaxClears = 0
  ByStamp = TRUE
  ByEpoch = FALSE
  ByReads = TRUE
SPECIFICATION Spec
\* The end of the edits is not a fault.
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoLostUpdate
PROPERTIES Converge
