\* The fault: the revision as the key. Two saves of one tab are in the
\* queue of its hook. The first one gets a conflict, but the second one has
\* the revision of the build of the other tab as its base, and writes over it.
\* TLC must find: Invariant NoLostUpdate is violated.
CONSTANTS
  Tabs = {t1, t2}
  MaxEdits = 3
  MaxRestarts = 0
  MaxFails = 0
  MaxClears = 0
  ByStamp = FALSE
  ByEpoch = TRUE
  ByReads = TRUE
SPECIFICATION Spec
\* The end of the edits is not a fault.
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoLostUpdate
