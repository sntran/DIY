\* Two tabs and three sign-ins, with any order of the steps and of the
\* answers. The store never has a revoked session, a tab has no socket
\* after a disconnect, and a refusal never closes a live socket.
CONSTANTS
  Tabs = {t1, t2}
  Sessions = {s1, s2, s3}
  MaxAccess = 2
  MaxEpoch = 2
  Mode = "ok"
SPECIFICATION Spec
\* The end of the steps (all sessions used) is not a fault.
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK StoreNotRevoked OffMeansNone NoLiveLoss
