\* The fault: a refresh writes its session with no check. A refresh that
\* was in flight puts back a session that a disconnect revoked.
\* TLC must find: Invariant StoreNotRevoked is violated.
CONSTANTS
  Tabs = {t1, t2}
  Sessions = {s1, s2, s3}
  MaxAccess = 2
  MaxEpoch = 2
  Mode = "nocas"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK StoreNotRevoked OffMeansNone NoLiveLoss
