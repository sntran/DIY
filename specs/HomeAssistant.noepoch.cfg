\* The fault: the tab keeps each exchange. The person disconnects while a
\* sign-in finishes, and the tab gets a socket after the disconnect.
\* TLC must find: Invariant OffMeansNone is violated.
CONSTANTS
  Tabs = {t1, t2}
  Sessions = {s1, s2, s3}
  MaxAccess = 2
  MaxEpoch = 2
  Mode = "noepoch"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK StoreNotRevoked OffMeansNone NoLiveLoss
