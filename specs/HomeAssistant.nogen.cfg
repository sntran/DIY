\* The fault: the tab of a sign-in keeps each exchange. The person
\* disconnects while a sign-in finishes, and the store gets the session of
\* the sign-in that started before the disconnect.
\* TLC must find: Invariant NoOldSignIn is violated.
CONSTANTS
  Tabs = {t1, t2}
  Sessions = {s1, s2, s3}
  MaxAccess = 2
  MaxGen = 2
  Mode = "nogen"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK StoreNotRevoked NoOldSignIn OffMeansNone NoLiveLoss
