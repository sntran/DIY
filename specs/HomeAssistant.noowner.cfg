\* The fault: a refused refresh ends the socket of the tab with no check.
\* A late refusal of an old session closes the socket of the new session.
\* TLC must find: Invariant NoLiveLoss is violated.
CONSTANTS
  Tabs = {t1, t2}
  Sessions = {s1, s2, s3}
  MaxAccess = 2
  MaxGen = 2
  Mode = "noowner"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK StoreNotRevoked NoOldSignIn OffMeansNone NoLiveLoss
