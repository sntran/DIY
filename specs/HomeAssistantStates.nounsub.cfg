\* The fault: the hook does not end its old watch after a change of the
\* registry. Home Assistant keeps two watches for the hook.
\* TLC must find: Invariant OneWatch is violated.
CONSTANTS
  Devices = {d1, d2}
  MaxChanges = 2
  MaxDrops = 1
  MaxRegistry = 1
  MaxControls = 1
  Mode = "nounsub"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK Fresh Ended OneWatch NoneOffline
