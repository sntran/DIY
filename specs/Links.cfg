\* Two links, a year of 3 days, and 8 days. A link that a person visited in
\* the last year is always there, and it keeps the day of that visit.
CONSTANTS
  Ids = {a, b}
  Days = 3
  Last = 8
  Mode = "ok"
SPECIFICATION Spec
\* The last day is not a fault.
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK Kept Fresh
