\* Two accounts, two changes of a person, three new tokens or disconnects,
\* three timers, one control and one lost message, in any order. The page
\* shows only the station of the account of the token. When all is quiet,
\* it shows the state of the cloud. After a disconnect, it shows no
\* station. The hook never waits for ever (Live).
CONSTANTS
  Accounts = {a1, a2}
  MaxChanges = 2
  MaxSwitches = 3
  MaxPolls = 3
  MaxControls = 1
  MaxLosses = 1
  Mode = "ok"
SPECIFICATION LSpec
\* The end of the steps (all the limits used) is not a fault.
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK PageOwn Fresh Clear
PROPERTIES Live
