\* Two accounts, two changes of a person, two new tokens or disconnects,
\* three timers and one control, in any order. The page shows only the
\* station of the account of the token. When all is quiet, it shows the
\* state of the cloud. After a disconnect, it shows no station.
CONSTANTS
  Accounts = {a1, a2}
  MaxChanges = 2
  MaxSwitches = 2
  MaxPolls = 3
  MaxControls = 1
  Mode = "ok"
SPECIFICATION Spec
\* The end of the steps (all the limits used) is not a fault.
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK PageOwn Fresh Clear
