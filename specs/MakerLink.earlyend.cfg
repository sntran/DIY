\* The fault "earlyend": the page shows the end of a control at once. TLC
\* finds the state from before the command as the state after the control
\* (EndNew).
\* TLC must find: Invariant EndNew is violated.
CONSTANTS
  Accounts = {a1, a2}
  MaxChanges = 2
  MaxSwitches = 2
  MaxPolls = 3
  MaxControls = 1
  MaxLosses = 1
  Mode = "earlyend"
  Lag = FALSE
SPECIFICATION Spec
\* The end of the steps (all the limits used) is not a fault.
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK PageOwn Fresh Clear EndNew
