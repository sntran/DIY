\* A station of EcoFlow that applies a command after its answer (Lag),
\* with the other limits of MakerLink.cfg. The end of a control waits for
\* the station (Settle). The page shows only the station of the account of
\* the token. When all is quiet, it shows the state of the cloud. The end
\* of a control shows only with a poll that read the station after the
\* change (EndNew). The hook never waits for ever (Live).
CONSTANTS
  Accounts = {a1, a2}
  MaxChanges = 2
  MaxSwitches = 3
  MaxPolls = 3
  MaxControls = 1
  MaxLosses = 1
  Mode = "ok"
  Lag = TRUE
SPECIFICATION LSpec
\* The end of the steps (all the limits used) is not a fault.
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK PageOwn Fresh Clear EndNew
PROPERTIES Live
