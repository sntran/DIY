\* The fault "noagain": the end of a control while a poll waits does
\* nothing. TLC finds the old state after the control (Fresh).
\* TLC must find: Invariant Fresh is violated.
CONSTANTS
  Accounts = {a1, a2}
  MaxChanges = 2
  MaxSwitches = 2
  MaxPolls = 3
  MaxControls = 1
  MaxLosses = 1
  Mode = "noagain"
SPECIFICATION Spec
\* The end of the steps (all the limits used) is not a fault.
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK PageOwn Fresh Clear
