\* The fault "nogen": a new token does not start a new generation. TLC
\* finds a late answer of the old account on the page (PageOwn).
\* TLC must find: Invariant PageOwn is violated.
CONSTANTS
  Accounts = {a1, a2}
  MaxChanges = 2
  MaxSwitches = 2
  MaxPolls = 3
  MaxControls = 1
  MaxLosses = 1
  Mode = "nogen"
  Lag = FALSE
SPECIFICATION Spec
\* The end of the steps (all the limits used) is not a fault.
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK PageOwn Fresh Clear
