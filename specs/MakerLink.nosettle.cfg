\* The fault "nosettle": with a station that applies a command after its
\* answer (Lag), the end of a control does not wait for the station. TLC
\* finds the end of the control with the state from before the change
\* (EndNew).
\* TLC must find: Invariant EndNew is violated.
CONSTANTS
  Accounts = {a1, a2}
  MaxChanges = 2
  MaxSwitches = 2
  MaxPolls = 3
  MaxControls = 1
  MaxLosses = 1
  Mode = "nosettle"
  Lag = TRUE
SPECIFICATION Spec
\* The end of the steps (all the limits used) is not a fault.
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK PageOwn Fresh Clear EndNew
