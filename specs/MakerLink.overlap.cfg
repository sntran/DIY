\* The fault "overlap": a timer starts a second poll while one waits. TLC
\* finds the answer of the older poll last, with the old state (Fresh).
\* TLC must find: Invariant Fresh is violated.
CONSTANTS
  Accounts = {a1, a2}
  MaxChanges = 2
  MaxSwitches = 2
  MaxPolls = 3
  MaxControls = 1
  Mode = "overlap"
SPECIFICATION Spec
\* The end of the steps (all the limits used) is not a fault.
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK PageOwn Fresh Clear
