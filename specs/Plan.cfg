\* Two rooms on a grid of 3 by 3, and an item of 1 or 2 on each side. A side
\* of 2 is larger than a room of side 1. The steps come in any order. No two
\* rooms overlap, and the item is always in its room.
CONSTANTS
  Rooms = {r1, r2}
  Size = 3
  Sides = {1, 2}
  None = None
  Mode = "ok"
SPECIFICATION Spec
INVARIANTS TypeOK NoOverlap Inside
