\* Two tabs, two names with two rooms each, and a person in Home Assistant,
\* with any order of the steps. Home Assistant has one area for each name,
\* and an area has one room. Each chosen room gets the area of its name,
\* and each match ends.
CONSTANTS
  Tabs = {t1, t2}
  Names = {"den", "office"}
  Twins = 2
  MaxCopy = 2
  MaxPerson = 1
  None = None
  Mode = "ok"
SPECIFICATION Spec
\* The end of the steps (both tabs done) is not a fault.
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK OneAreaEach OneRoomEach NoneFailed SameName
PROPERTIES Ends
