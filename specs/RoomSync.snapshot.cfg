\* The fault: the tab looks for the area of a refused name in the areas
\* that it read when its sheet opened. A different tab (or a person) added
\* the area later, so the room gets no area.
\* TLC must find: Invariant NoneFailed is violated.
CONSTANTS
  Tabs = {t1, t2}
  Names = {"den", "office"}
  Twins = 2
  MaxCopy = 2
  MaxPerson = 1
  None = None
  Mode = "snapshot"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK OneAreaEach OneRoomEach NoneFailed SameName
