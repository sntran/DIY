\* The fault: the tab adds the area with a new name when Home Assistant
\* refuses the name. Two tabs add the same room, and Home Assistant gets two
\* areas for it.
\* TLC must find: Invariant OneAreaEach is violated.
CONSTANTS
  Tabs = {t1, t2}
  Names = {"den", "office"}
  Twins = 2
  MaxCopy = 2
  MaxPerson = 1
  None = None
  Mode = "suffix"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK OneAreaEach NoneFailed SameName
