\* The fault: the server has no rules for the names. The person chooses the
\* twin of a room with an area. Home Assistant refuses its name, and the
\* twin gets the area of the other room.
\* TLC must find: Invariant OneRoomEach is violated.
CONSTANTS
  Tabs = {t1, t2}
  Names = {"den", "office"}
  Twins = 2
  MaxCopy = 2
  MaxPerson = 1
  None = None
  Mode = "twins"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK OneAreaEach OneRoomEach NoneFailed SameName
