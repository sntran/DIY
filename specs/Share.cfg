\* Two rooms and two vans, and any order of the steps: the station is never
\* in a place that is not there, and its home is always there.
CONSTANTS
  Rooms = {r1, r2}
  Vans = {v1, v2}
  ClearHomes = TRUE
SPECIFICATION Spec
\* The end of the steps (all removed) is not a fault.
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK InPlace HomeThere
