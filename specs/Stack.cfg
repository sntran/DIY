\* Three items in two rooms. One item does not go in the room outside.
\* The steps come in any order. Each item fits its room. The item under
\* an item is there and under it. No item is under itself. An item that
\* comes down goes on an item that holds it.
CONSTANTS
  Items = {i1, i2, i3}
  Rooms = {r1, r2}
  Out = r2
  InsideOnly = {i1}
  None = None
  Mode = "ok"
SPECIFICATION Spec
INVARIANTS TypeOK Fit OnExists NoLoop
PROPERTY SeatFallen
