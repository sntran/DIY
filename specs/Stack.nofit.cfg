\* The fault: the items on an item go with it to a room that they do
\* not fit.
\* TLC must find: Invariant Fit is violated.
CONSTANTS
  Items = {i1, i2, i3}
  Rooms = {r1, r2}
  Out = r2
  InsideOnly = {i1}
  None = None
  Mode = "nofit"
SPECIFICATION Spec
INVARIANTS TypeOK Fit OnExists NoLoop NoInside
