\* The fault: a drop can put an item on an item that is on it, and the
\* check does not see the loop.
\* TLC must find: Invariant NoLoop is violated.
CONSTANTS
  Items = {i1, i2, i3}
  Rooms = {r1, r2}
  Out = r2
  InsideOnly = {i1}
  None = None
  Mode = "noloop"
SPECIFICATION Spec
INVARIANTS TypeOK Fit OnExists NoLoop NoInside
