\* The fault: the fill does not check the place of the cab. A stored build
\* or a new model keeps a cab that is not at the front.
\* TLC must find: Invariant CabAtFront is violated
CONSTANTS
  Lengths = {3, 4, 5}
  Mode = "nocab"
SPECIFICATION Spec
INVARIANTS TypeOK InBox NoOverlap CabAtFront EngineAtFront
