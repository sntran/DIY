\* The fault: the fill keeps the stored engine bay. A stored build or a new
\* model keeps an engine bay that is not in front of the box.
\* TLC must find: Invariant EngineAtFront is violated
CONSTANTS
  Lengths = {3, 4, 5}
  Mode = "noengine"
SPECIFICATION Spec
INVARIANTS TypeOK InBox NoOverlap CabAtFront EngineAtFront
